name: Uppdatera och publicera Svensk Makropuls
on:
  push:
    branches: [main]
  schedule:
    # Var tredje timme. Schemalagda GitHub-jobb kan bli fördröjda.
    - cron: '17 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: makropuls-deploy
  cancel-in-progress: false
jobs:
  uppdatera-och-publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Uppdatera offentlig data
        run: python scripts/update_data.py
      - name: Uppdatera råvaror och svenska elpriser
        run: python scripts/update_commodities.py
      - name: Uppdatera veckopriser för bensin och diesel
        run: python scripts/update_fuel.py
      - name: Beräkna bensinprisestimat från officiell veckodata och Brent
        run: python scripts/update_fuel_model.py
      - name: Spara data i repositoryt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'makropuls-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Bevara ENBART de fyra genererade datafilerna innan vi
          # hämtar senaste main. Här i GitHub Actions är arbetskatalogen tillfällig.
          snapshot="$(mktemp -d)"
          trap 'rm -rf "$snapshot"' EXIT
          for filename in market.json commodities.json fuel.json fuel_model.json; do
            test -f "data/$filename"
            cp "data/$filename" "$snapshot/$filename"
          done

          # En annan commit kan ha tillkommit medan uppdateringen kördes.
          # Utgå varje gång från senaste main; skriv aldrig över historiken
          # med force push. Behåll bara våra nygenererade datafiler.
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            mkdir -p data
            for filename in market.json commodities.json fuel.json fuel_model.json; do
              cp "$snapshot/$filename" "data/$filename"
            done
            git add -- data/market.json data/commodities.json data/fuel.json data/fuel_model.json

            if git diff --cached --quiet; then
              echo 'Ingen förändring av data att spara.'
              break
            fi

            git commit -m 'chore: uppdatera makrodata'
            if git push origin HEAD:main; then
              echo 'Data sparade på senaste main.'
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo '::error::Kunde inte spara data efter tre försök. Inga ändringar har tvångspushats.'
              exit 1
            fi
            echo 'main ändrades samtidigt; hämtar senaste och försöker igen.'
            sleep $((attempt * 2))
          done
      - name: Skapa webbpaket
        run: |
          mkdir -p public/assets public/data
          cp ./*.html public/
          touch public/.nojekyll
          cp assets/* public/assets/
          cp data/market.json data/commodities.json data/fuel.json data/fuel_model.json public/data/
      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
      - name: Ladda upp webbpaketet
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
