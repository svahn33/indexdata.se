name: Uppdatera och publicera Svensk Makropuls
on:
  push:
    branches: [main]
  schedule:
    # 17:30 UTC alla dagar (även helger för svenska spotelpriser).
    - cron: '30 6 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: makropuls-deploy
  cancel-in-progress: false
jobs:
  uppdatera-och-publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta kod
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Uppdatera offentlig data
        run: python scripts/update_data.py
      - name: Uppdatera råvaror och svenska elpriser
        run: python scripts/update_commodities.py
      - name: Spara data i repositoryt
        run: |
          git config user.name 'makropuls-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/commodities.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: uppdatera makrodata'
            git push
          else
            echo 'Inga förändringar'
          fi
      - name: Skapa webbpaket
        run: |
          mkdir -p public/assets public/data
          cp ./*.html public/
          touch public/.nojekyll
          cp assets/* public/assets/
          cp data/market.json data/commodities.json public/data/
      - name: Konfigurera GitHub Pages
        uses: actions/configure-pages@v5
      - name: Ladda upp webbpaketet
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicera GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
